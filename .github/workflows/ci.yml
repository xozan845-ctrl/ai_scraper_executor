name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate --schema=prisma/schema.prisma
      - run: npm run build --workspaces
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
