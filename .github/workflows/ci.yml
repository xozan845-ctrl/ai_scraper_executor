name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scraper
          POSTGRES_PASSWORD: scraper
          POSTGRES_DB: scraper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scraper"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Prisma generate
        run: npm run prisma:generate
      - name: Prisma schema valid
        run: npx prisma validate --schema=prisma/schema.prisma
      - name: Apply migrations to service DB
        run: npx prisma migrate deploy --schema=prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://scraper:scraper@localhost:5432/scraper?schema=public
      - name: Migrations have no drift
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: postgresql://scraper:scraper@localhost:5432/scraper?schema=public
      - name: Build
        run: npm run build
      - name: OpenAPI spec in sync
        run: npm run openapi:check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
        env:
          MONGODB_MOCK: '1'
      - name: Contract
        run: npm run test:contract
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: warn

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scraper
          POSTGRES_PASSWORD: scraper
          POSTGRES_DB: scraper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scraper"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mongodb:
        image: mongo:7-jammy
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Prisma generate
        run: npm run prisma:generate
      - name: Apply migrations
        run: npx prisma migrate deploy --schema=prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://scraper:scraper@localhost:5432/scraper?schema=public
      - name: Build
        run: npm run build
      - name: Integration
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://scraper:scraper@localhost:5432/scraper?schema=public
          MONGODB_URI: mongodb://localhost:27017/scraper
          REDIS_URL: redis://localhost:6379
