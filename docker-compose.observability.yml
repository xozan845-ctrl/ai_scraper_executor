# Stack de observabilidad local: Prometheus + Grafana sobre el compose base.
#
#   API_KEYS= docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# Arranca la API con la autenticación vacía para que Prometheus pueda raspar
# `/api/v1/metrics/prometheus` sin cabecera (R-TM-7). NO es el stack de producción:
# allí el endpoint exige `x-api-key` y el scrape debe llevarla fuera del repo.
services:
  api:
    environment:
      API_KEYS: ''

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3001:3000'
    restart: unless-stopped
