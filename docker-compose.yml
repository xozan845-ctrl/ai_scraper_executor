services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scraper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scraper}
      POSTGRES_DB: ${POSTGRES_DB:-scraper}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:7-jammy
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-scraper}
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis separado para la cola (R-RD-1). Opcional: se arranca con
  # `docker compose --profile split-redis up` y apuntando QUEUE_REDIS_URL a este host.
  redis-queue:
    image: redis:7-alpine
    profiles: ["split-redis"]
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Migraciones Prisma (ETAPA 5): one-shot antes de api/worker. Nunca `migrate dev` en compose.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://scraper:scraper@postgres:5432/scraper?schema=public
      MONGODB_URI: mongodb://mongodb:27017/${MONGODB_DB:-scraper}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    command: npx prisma migrate deploy --schema=prisma/schema.prisma

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://scraper:scraper@postgres:5432/scraper?schema=public
      MONGODB_URI: mongodb://mongodb:27017/${MONGODB_DB:-scraper}
      REDIS_URL: redis://redis:6379
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-redis://redis:6379}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: npm run start -w api
    restart: unless-stopped

  # Escala horizontal FASE 10: docker compose up --scale worker=3
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://scraper:scraper@postgres:5432/scraper?schema=public
      MONGODB_URI: mongodb://mongodb:27017/${MONGODB_DB:-scraper}
      REDIS_URL: redis://redis:6379
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-redis://redis:6379}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      CRAWLEE_MAX_CONCURRENCY: ${CRAWLEE_MAX_CONCURRENCY:-5}
      CRAWLEE_MAX_REQUESTS_PER_MINUTE: ${CRAWLEE_MAX_REQUESTS_PER_MINUTE:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
    command: npm run start -w worker
    restart: unless-stopped

volumes:
  postgres-data:
  mongodb-data:
  redis-data:
  redis-queue-data:
